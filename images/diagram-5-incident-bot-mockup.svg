<svg width="420" height="360" viewBox="0 0 420 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Мокап Telegram-бота мониторинга инцидентов контент-фабрики</title>
<desc>Три карточки инцидентов: аккаунт заблокирован (критично), публикация не прошла (внимание), инцидент устранён (решено)</desc>
<rect width="420" height="360" fill="#13141A"/>
<rect x="20" y="20" width="380" height="320" rx="12" fill="#1C1E27" stroke="#2E3044" stroke-width="0.5"/>

<circle cx="56" cy="56" r="18" fill="#5C1A1A"/>
<text x="56" y="61" text-anchor="middle" fill="#F87171" font-family="Arial" font-size="16">!</text>
<text x="84" y="52" fill="#E4E5F0" font-family="Arial" font-size="14" font-weight="600">Мониторинг инцидентов</text>
<text x="84" y="68" fill="#7E8299" font-family="Arial" font-size="12">контент-фабрика · бот</text>
<line x1="36" y1="86" x2="384" y2="86" stroke="#2E3044" stroke-width="0.5"/>

<rect x="36" y="102" width="348" height="60" rx="8" fill="#5C1A1A" opacity="0.35"/>
<text x="50" y="120" fill="#F87171" font-family="Arial" font-size="12" font-weight="600">Аккаунт заблокирован</text>
<text x="50" y="138" fill="#E4E5F0" font-family="Arial" font-size="13">acc_047 · площадка: TikTok</text>
<text x="50" y="154" fill="#7E8299" font-family="Arial" font-size="11">14:32</text>

<rect x="36" y="172" width="348" height="60" rx="8" fill="#4A3410" opacity="0.35"/>
<text x="50" y="190" fill="#D4A030" font-family="Arial" font-size="12" font-weight="600">Публикация не прошла</text>
<text x="50" y="208" fill="#E4E5F0" font-family="Arial" font-size="13">acc_012 · ошибка загрузки видео</text>
<text x="50" y="224" fill="#7E8299" font-family="Arial" font-size="11">13:58</text>

<rect x="36" y="242" width="348" height="60" rx="8" fill="#1A4A2E" opacity="0.35"/>
<text x="50" y="260" fill="#4ADE80" font-family="Arial" font-size="12" font-weight="600">Инцидент устранён</text>
<text x="50" y="278" fill="#E4E5F0" font-family="Arial" font-size="13">acc_047 · доступ восстановлен</text>
<text x="50" y="294" fill="#7E8299" font-family="Arial" font-size="11">13:41</text>
</svg>
